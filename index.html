        :root{

            --bg-card:rgba(255,255,255,0.05);
            --bg-card-hover:rgba(255,255,255,0.09);
            --glass-blur:16px;
            --radius-xl:22px;
            --radius-lg:16px;
            --radius-md:12px;
            --shadow-base: 0 8px 32px rgba(0,0,0,0.24);
        }
        [data-theme="light"]{

            --blue-glow:rgba(96,165,250,0.16);
            --shadow-base:0 8px 32px rgba(0,0,0,0.08);
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;scroll-padding-top:80px;}
        ::-webkit-scrollbar {width:8px;height:8px;}
        ::-webkit-scrollbar-track {background:transparent;}
        ::-webkit-scrollbar-thumb {background:var(--line);border-radius:99px;}
        ::selection{background:var(--blue-primary);color:#000;}
        html,body{min-height:100%;}
        body{
            font-family:"Noto Sans SC",system-ui,-apple-system,Segoe UI,sans-serif;
            color:var(--text);
            transition: color 0.35s ease, background 0.4s ease;
            line-height:1.7;
            overflow-x:hidden;
            position:relative;
            background:#04060f;
            opacity:0;
            animation: pageFadeIn 1s ease forwards;
        }
        @keyframes pageFadeIn {to {opacity:1;}}
        /* 页面顶部加载进度条 */
        .page-loader-bar{
            position:fixed;top:0;left:0;height:3px;width:0%;
            background:linear-gradient(90deg,#7cf,#60a5fa);
            z-index:9999;
            transition: width 0.2s ease;
        }
        /* 键盘彩蛋全屏极光爆发层 */
        .easter-egg-overlay{
            position:fixed;inset:0;background:transparent;pointer-events:none;
            z-index:9998;opacity:0;transition:opacity 0.6s ease;
        }
        .easter-egg-overlay.active{
            opacity:1;
            background:radial-gradient(circle, rgba(124,207,255,0.35), transparent 60%);
            animation: burstAurora 2.2s ease-out forwards;
        }
        @keyframes burstAurora{
            0%{filter:brightness(1);}
            50%{filter:brightness(1.6);}
            100%{filter:brightness(1);opacity:0;}
        }
        /* 返回顶部按钮 */
        .back-top{
            position:fixed;bottom:28px;right:28px;
            width:48px;height:48px;border-radius:50%;
            border:1px solid var(--line);background:var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));color:var(--text);
            font-size:20px;cursor:pointer;display:none;
            transition:0.3s ease;box-shadow:var(--shadow-base);
            z-index:90;
        }
        .back-top.show{display:block;}
        .back-top:hover{transform:translateY(-3px);box-shadow:0 0 16px var(--blue-glow);}
